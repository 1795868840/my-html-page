<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计量证书查询</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff;color:#222;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
  .topbar{height:43px;background:#f5f5f5;border-bottom:1px solid #ddd;display:flex;align-items:center}
  .tab{height:43px;min-width:238px;padding:0 14px;display:flex;align-items:center;background:#fff;border-right:1px solid #ddd;font-size:16px}
  .close{margin-left:auto;width:20px;height:20px;border:1px solid #777;border-radius:50%;font-size:15px;line-height:17px;text-align:center;color:#555}
  .search-icon{width:40px;height:37px;margin-left:5px;border:1px solid #ddd;background:#f5f5f5;font-size:23px;text-align:center;line-height:35px;color:#555}
  .blue-line{height:4px;background:#438acb;margin:0 4px}
  .page{width:calc(100% - 150px);max-width:900px;margin:20px auto 0}
  .title{text-align:center;font-size:20px;font-weight:600;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid #ddd}
  .input-wrap{border:1px solid #d8d8d8;height:62px;display:flex;align-items:center;justify-content:center;margin:15px 26px}
  .input-wrap input{border:0;outline:none;width:100%;height:100%;text-align:center;font-size:20px;color:#111;background:transparent}
  .query{height:46px;margin:0 26px 19px;background:#438acb;color:#fff;border:0;width:calc(100% - 52px);font-size:20px;font-weight:600;cursor:pointer}
  .query:hover{background:#357bbb}
  .result{display:none;margin:0}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:19px}
  td{border-bottom:1px solid #666;height:64px;padding:10px 15px}
  td.label{width:31%;background:#a8d2f2;text-align:center;font-weight:700;color:#15354e}
  td.value{width:69%;font-weight:600;padding-left:16px}
  .notice{display:none;text-align:center;color:#d33;padding:16px;font-size:16px}
  @media(max-width:700px){
    .page{width:92%;margin-top:16px}
    .tab{min-width:190px}
    table{font-size:16px}
    td{height:58px}
    .input-wrap{margin-left:0;margin-right:0}
    .query{margin-left:0;margin-right:0;width:100%}
    .title{font-size:18px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="tab">管理首页 <span class="close">×</span></div>
    <div class="search-icon">⌕</div>
  </div>
  <div class="blue-line"></div>

  <main class="page">
    <h1 class="title">请输入计量证书编号或证书条码</h1>

    <div class="input-wrap">
      <input id="certInput" value="HB202669114309" autocomplete="off">
    </div>
    <button class="query" onclick="queryCertificate()">查询</button>

    <div id="notice" class="notice">未查询到该证书，请检查证书编号或证书条码。</div>

    <section id="result" class="result">
      <table>
        <tr><td class="label">证书编号</td><td class="value" id="certNo"></td></tr>
        <tr><td class="label">送检单位</td><td class="value" id="company"></td></tr>
        <tr><td class="label">计量器具名称</td><td class="value" id="instrument"></td></tr>
        <tr><td class="label">型号/规格</td><td class="value" id="spec"></td></tr>
        <tr><td class="label">管理编号</td><td class="value" id="manageNo"></td></tr>
        <tr><td class="label">制造单位</td><td class="value" id="manufacturer"></td></tr>
        <tr><td class="label">批准人</td><td class="value" id="approver"></td></tr>
        <tr><td class="label">核验员</td><td class="value" id="verifier"></td></tr>
        <tr><td class="label">检定员</td><td class="value" id="inspector"></td></tr>
        <tr><td class="label">出厂编号</td><td class="value" id="factoryNo"></td></tr>
        <tr><td class="label">校准日期</td><td class="value" id="date"></td></tr>
      </table>
    </section>
  </main>

<script>
const certificates = {
  "HB202669114309": {
    certNo:"HB202669114309",
    company:"东莞泓辰玩具有限公司",
    instrument:"压力表",
    spec:"0-1.6MPa",
    manageNo:"HC-019",
    manufacturer:"/",
    approver:"郑涛",
    verifier:"郑涛",
    inspector:"宁亮",
    factoryNo:"20210597797",
    date:"20260413"
  }
};

function showData(d){
  for(const [key,value] of Object.entries(d)){
    const el=document.getElementById(key);
    if(el) el.textContent=value;
  }
  document.getElementById("notice").style.display="none";
  document.getElementById("result").style.display="block";
}
function queryCertificate(){
  const code=document.getElementById("certInput").value.trim().toUpperCase();
  const data=certificates[code];
  if(data){
    showData(data);
  }else{
    document.getElementById("result").style.display="none";
    document.getElementById("notice").style.display="block";
  }
}
document.getElementById("certInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") queryCertificate();
});
queryCertificate();
</script>
</body>
</html>
